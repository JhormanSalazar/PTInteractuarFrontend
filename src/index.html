<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Solicitudes de servicio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gestión de solicitudes de servicio técnico: creación, asignación a técnicos, seguimiento de estado y prioridad."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- El backend vive en otro origen y corre sobre un plan gratuito que
         suspende el computo por inactividad. Abrir la conexion (DNS + TCP + TLS)
         en cuanto se parsea el <head>, antes de que el bundle de JavaScript se
         descargue y ejecute, le quita ese trabajo del camino critico a la
         primera peticion real. -->
    <link rel="preconnect" href="https://interactuar-backend.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://interactuar-backend.vercel.app" />

    <!-- Ping de calentamiento adelantado.
         La aplicacion ya lanza uno a /health al arrancar (App), pero eso ocurre
         despues de descargar, parsear y ejecutar el bundle: medido contra el
         despliegue real, cerca de un segundo mas tarde. Como lo caro del
         arranque en frio es despertar el computo de Neon (~1.9s medidos), ese
         segundo se paga integro y en serie.
         Disparandolo aqui, en el <head>, el despertar de la base ocurre EN
         PARALELO con la descarga del bundle en vez de despues, y cuando la
         aplicacion pide los datos la base ya esta despierta.
         Es best-effort: si falla no pasa nada, la aplicacion se encarga igual.
         Solo se dispara en el dominio desplegado, para no golpear el backend de
         produccion desde una sesion de desarrollo local. -->
    <script>
      if (location.hostname.endsWith('.vercel.app')) {
        fetch('https://interactuar-backend.vercel.app/api/v1/health', {
          mode: 'cors',
          cache: 'no-store',
        }).catch(function () {
          /* silencioso a proposito: es una optimizacion, no una dependencia */
        });
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
