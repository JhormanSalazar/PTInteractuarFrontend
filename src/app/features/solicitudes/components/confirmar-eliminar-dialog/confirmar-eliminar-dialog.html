<div class="dialog-shell dialog-shell--centrado" role="document">
  <button type="button" class="dialog-cerrar btn-icon btn-ghost" aria-label="Cerrar" (click)="cancelar()">
    <app-icon name="x" [size]="18" />
  </button>

  <div class="dialog-body dialog-body--centrado">
    <span class="dialog-icono dialog-icono--peligro" aria-hidden="true">
      <app-icon name="triangle-alert" [size]="26" />
    </span>

    <h2 id="confirmar-eliminar-title" class="dialog-titulo-centrado">Eliminar solicitud</h2>

    <p class="dialog-descripcion">
      Vas a eliminar la solicitud <strong>{{ solicitud.codigo }}</strong><br />
      «{{ solicitud.titulo }}»
    </p>

    <p class="dialog-advertencia">Esta acción no se puede deshacer.</p>
  </div>

  <footer class="dialog-footer dialog-footer--centrado">
    <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    <button type="button" class="btn btn-danger" [disabled]="eliminando()" (click)="confirmar()">
      @if (eliminando()) {
        <span class="spinner" aria-hidden="true"></span>
        Eliminando…
      } @else {
        <app-icon name="trash-2" [size]="16" />
        Eliminar
      }
    </button>
  </footer>
</div>
