<div class="dialog-shell dialog-shell--centrado" role="document">
  <button type="button" class="dialog-cerrar btn-icon btn-ghost" aria-label="Cerrar" (click)="cerrar(false)">
    <app-icon name="x" [size]="18" />
  </button>

  <div class="dialog-body dialog-body--centrado">
    <span
      class="dialog-icono"
      [class.dialog-icono--peligro]="esPeligro()"
      [class.dialog-icono--info]="!esPeligro()"
      aria-hidden="true"
    >
      <app-icon [name]="esPeligro() ? 'triangle-alert' : 'refresh-cw'" [size]="26" />
    </span>

    <h2 id="confirmar-dialog-title" class="dialog-titulo-centrado">{{ data.titulo }}</h2>

    <p class="dialog-descripcion">{{ data.mensaje }}</p>

    @if (data.advertencia) {
      <p class="dialog-advertencia">{{ data.advertencia }}</p>
    }
  </div>

  <footer class="dialog-footer dialog-footer--centrado">
    <button type="button" class="btn btn-secondary" (click)="cerrar(false)">Cancelar</button>
    <button type="button" [class]="'btn ' + variante()" (click)="cerrar(true)">
      {{ data.textoConfirmar }}
    </button>
  </footer>
</div>
